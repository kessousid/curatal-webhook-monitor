<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Curatal Webhook Monitor</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e3e3e6;
    --ok: #1a7f37;
    --bad: #c9302c;
    --warn: #b06a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --card: #1f2023;
      --text: #ececec;
      --muted: #9a9a9a;
      --border: #2e2f33;
      --ok: #3fb950;
      --bad: #f85149;
      --warn: #e3b341;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    overflow-x: auto;
  }
  .card h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 8px; }
  .status-line { font-size: 1.1rem; font-weight: 600; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  .warn { color: var(--warn); }
  .alerts-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .alert-row { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .alert-row:last-child { border-bottom: none; }
  .alert-kind { font-weight: 600; color: var(--bad); }
  .target-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .target-row:last-child { border-bottom: none; }
  .target-name { font-weight: 600; }
  .target-url { color: var(--muted); font-size: 0.78rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  .empty { color: var(--muted); font-size: 0.85rem; }
  .refresh { color: var(--muted); font-size: 0.75rem; }
  #env-badge {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 6px;
    vertical-align: middle;
    background: var(--warn);
    color: #1a1a1a;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Curatal Webhook Monitor <span id="env-badge"></span></h1>
  <div class="sub">Razorpay payment webhook health &mdash; endpoint checks, delivery silence, and alerts.</div>

  <div class="card" style="margin-bottom: 12px;">
    <h2>Receiver Health</h2>
    <div id="targets-list" class="empty">Loading&hellip;</div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Last Webhook Heartbeat</h2>
      <div id="heartbeat-status" class="status-line">Loading&hellip;</div>
      <div id="heartbeat-detail" class="empty"></div>
    </div>
    <div class="card">
      <h2>Razorpay Cross-check</h2>
      <div id="crosscheck-status" class="status-line">Loading&hellip;</div>
    </div>
  </div>

  <div class="alerts-card">
    <h2>Open Alerts</h2>
    <div id="alerts-list" class="empty">Loading&hellip;</div>
  </div>

  <div class="card">
    <h2>Recent Health Checks</h2>
    <table>
      <thead><tr><th>Time</th><th>Target</th><th>Result</th><th>Status</th><th>Latency</th><th>Error</th></tr></thead>
      <tbody id="checks-body"><tr><td colspan="6" class="empty">Loading&hellip;</td></tr></tbody>
    </table>
  </div>

  <div class="refresh" id="refresh-note"></div>
</div>

<script>
function timeAgo(iso) {
  if (!iso) return 'never';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.round(hrs / 24) + 'd ago';
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function refresh() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();

    const badge = document.getElementById('env-badge');
    if (data.environment && data.environment !== 'production') {
      badge.textContent = data.environment;
      badge.style.display = 'inline';
    } else {
      badge.style.display = 'none';
    }

    const targetsEl = document.getElementById('targets-list');
    if (!data.targets.length) {
      targetsEl.innerHTML = '<div class="empty">No targets configured. Set WEBHOOK_ENDPOINT_URL or EXTRA_HEALTH_CHECK_TARGETS.</div>';
    } else {
      targetsEl.innerHTML = data.targets.map((t) => {
        const c = t.last_check;
        const statusText = !c ? 'No data yet' : (c.success ? 'Up' : 'Down');
        const statusClass = !c ? 'warn' : (c.success ? 'ok' : 'bad');
        const detail = c ? `${c.status_code ?? (c.error || '—')} · ${timeAgo(c.checked_at)}` : '';
        return `<div class="target-row">
          <div><span class="target-name">${esc(t.name)}</span><br><span class="target-url">${esc(t.method)} ${esc(t.url)}</span></div>
          <div style="text-align:right;"><span class="status-line ${statusClass}">${statusText}</span><br><span class="target-url">${esc(detail)}</span></div>
        </div>`;
      }).join('');
    }

    const urlToName = Object.fromEntries(data.targets.map((t) => [t.url, t.name]));

    const hb = data.last_heartbeat;
    const hbStatusEl = document.getElementById('heartbeat-status');
    const hbDetailEl = document.getElementById('heartbeat-detail');
    if (!hb) {
      hbStatusEl.textContent = 'None received';
      hbStatusEl.className = 'status-line warn';
      hbDetailEl.textContent = 'Wire the /heartbeat call into your webhook handler (see README) to enable silence detection.';
    } else {
      hbStatusEl.textContent = timeAgo(hb.received_at);
      hbStatusEl.className = 'status-line ok';
      hbDetailEl.textContent = hb.event_type || '';
    }

    const ccEl = document.getElementById('crosscheck-status');
    ccEl.textContent = data.cross_check_enabled ? 'Enabled' : 'Disabled (no Razorpay key set)';
    ccEl.className = 'status-line ' + (data.cross_check_enabled ? 'ok' : 'empty');

    const alertsEl = document.getElementById('alerts-list');
    if (!data.open_alerts.length) {
      alertsEl.innerHTML = '<div class="empty">No open alerts.</div>';
    } else {
      alertsEl.innerHTML = data.open_alerts.map(a =>
        `<div class="alert-row"><span class="alert-kind">${esc(a.kind)}</span> &mdash; ${esc(a.message)}<br><span class="empty">${timeAgo(a.created_at)}</span></div>`
      ).join('');
    }

    const checksBody = document.getElementById('checks-body');
    if (!data.recent_checks.length) {
      checksBody.innerHTML = '<tr><td colspan="6" class="empty">No checks yet.</td></tr>';
    } else {
      checksBody.innerHTML = data.recent_checks.map(c => `
        <tr>
          <td>${timeAgo(c.checked_at)}</td>
          <td>${esc(urlToName[c.target_url] || c.target_url)}</td>
          <td class="${c.success ? 'ok' : 'bad'}">${c.success ? 'OK' : 'FAIL'}</td>
          <td>${c.status_code ?? '—'}</td>
          <td>${c.latency_ms}ms</td>
          <td>${esc(c.error || '')}</td>
        </tr>
      `).join('');
    }

    document.getElementById('refresh-note').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById('refresh-note').textContent = 'Failed to refresh: ' + err.message;
  }
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
